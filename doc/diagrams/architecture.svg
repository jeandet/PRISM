<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img"
     aria-label="PRISM architecture: Model, View and Behavior live on the application thread, which publishes an immutable SceneSnapshot that the render thread rasterises">
  <style>
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .t { fill: #1f2328; font: 600 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { fill: #1f2328; font: 600 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .s { fill: #59636e; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .c { fill: #1f2328; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .app { fill: #ddf4ff; stroke: #0969da; fill-opacity: .45; }
    .ren { fill: #fff1e5; stroke: #bc4c00; fill-opacity: .55; }
    .snap { fill: #fbefff; stroke: #8250df; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #8c959f; }
    .appl { fill: #0969da; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .renl { fill: #bc4c00; font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .snapl { fill: #8250df; font: 600 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .arrow { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .ah { fill: #59636e; }
    .num { fill: #1f2328; }
    .numt { fill: #ffffff; font: 700 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .t, .h, .c { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .app { fill: #0c2d6b; stroke: #4493f8; }
      .ren { fill: #3d1d00; stroke: #f0883e; }
      .snap { fill: #2e1a4a; stroke: #ab7df8; }
      .box { fill: #0d1117; stroke: #6e7681; }
      .appl { fill: #4493f8; }
      .renl { fill: #f0883e; }
      .snapl { fill: #ab7df8; }
      .arrow { stroke: #9198a1; }
      .ah { fill: #9198a1; }
      .num { fill: #e6edf3; }
      .numt { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="899" height="419" rx="10"/>

  <!-- Application thread -->
  <rect class="app" x="20" y="20" width="500" height="380" rx="10"/>
  <text class="appl" x="40" y="46">APPLICATION THREAD</text>
  <text class="s" x="40" y="64">owns the widget tree and every Field&lt;T&gt; · sleeps on a stdexec run_loop</text>

  <rect class="box" x="40" y="86" width="460" height="92" rx="8"/>
  <text class="h" x="60" y="112">View</text>
  <text class="c" x="104" y="112">Widget&lt;T&gt;</text>
  <text class="s" x="60" y="134">persistent WidgetTree, built once from the model</text>
  <text class="s" x="60" y="152">handle_input() turns raw input into field edits</text>
  <text class="s" x="60" y="170">record() re-runs only for dirty widgets</text>

  <rect class="box" x="40" y="250" width="215" height="130" rx="8"/>
  <text class="h" x="60" y="276">Model</text>
  <text class="c" x="60" y="300">Field&lt;T&gt;  State&lt;T&gt;</text>
  <text class="c" x="60" y="318">List&lt;T&gt;   Derived&lt;T&gt;</text>
  <text class="s" x="60" y="342">plain structs · data +</text>
  <text class="s" x="60" y="360">change notification</text>

  <rect class="box" x="285" y="250" width="215" height="130" rx="8"/>
  <text class="h" x="305" y="276">Behavior</text>
  <text class="c" x="305" y="300">on_change()</text>
  <text class="c" x="305" y="318">observe()</text>
  <text class="s" x="305" y="342">your logic, reacting to</text>
  <text class="s" x="305" y="360">field changes</text>

  <path class="arrow" d="M100,180 V248" marker-end="url(#a)"/>
  <text class="c" x="108" y="218">set()</text>
  <path class="arrow" d="M200,248 V180" marker-end="url(#a)"/>
  <text class="s" x="208" y="218">mark dirty</text>
  <path class="arrow" d="M257,300 H283" marker-end="url(#a)"/>
  <path class="arrow" d="M283,330 H257" marker-end="url(#a)"/>

  <!-- Snapshot handoff -->
  <rect class="snap" x="550" y="196" width="140" height="108" rx="10"/>
  <text class="snapl" x="620" y="224" text-anchor="middle">SceneSnapshot</text>
  <text class="s" x="620" y="246" text-anchor="middle">immutable, versioned</text>
  <text class="s" x="620" y="264" text-anchor="middle">DrawList per widget</text>
  <text class="s" x="620" y="290" text-anchor="middle">latest one wins</text>

  <!-- Render thread -->
  <rect class="ren" x="720" y="20" width="160" height="380" rx="10"/>
  <text class="renl" x="736" y="46">RENDER THREAD</text>
  <text class="s" x="736" y="64">owns the window</text>

  <rect class="box" x="736" y="86" width="128" height="72" rx="8"/>
  <text class="h" x="800" y="114" text-anchor="middle">OS events</text>
  <text class="c" x="800" y="136" text-anchor="middle">SDL_WaitEvent</text>

  <rect class="box" x="736" y="250" width="128" height="72" rx="8"/>
  <text class="h" x="800" y="278" text-anchor="middle">Rasterise</text>
  <text class="h" x="800" y="298" text-anchor="middle">+ present</text>

  <text class="s" x="800" y="356" text-anchor="middle">never calls</text>
  <text class="s" x="800" y="374" text-anchor="middle">application code</text>

  <!-- Cross-thread flow, numbered in order -->
  <path class="arrow" d="M734,110 H502" marker-end="url(#a)"/>
  <text class="s" x="618" y="102" text-anchor="middle">InputEvent via run_loop</text>
  <path class="arrow" d="M502,160 H530 V230 H548" marker-end="url(#a)"/>
  <text class="s" x="536" y="174">publish</text>
  <text class="s" x="536" y="190">+ wake</text>
  <path class="arrow" d="M692,270 H706 V286 H734" marker-end="url(#a)"/>
  <path class="arrow" d="M800,160 V248" marker-end="url(#a)"/>
  <text class="s" x="806" y="200">then load</text>
  <text class="s" x="806" y="216">latest</text>

  <g>
    <circle class="num" cx="618" cy="122" r="9"/><text class="numt" x="618" y="126" text-anchor="middle">1</text>
    <circle class="num" cx="84" cy="214" r="9"/><text class="numt" x="84" y="218" text-anchor="middle">2</text>
    <circle class="num" cx="270" cy="286" r="9"/><text class="numt" x="270" y="290" text-anchor="middle">3</text>
    <circle class="num" cx="184" cy="214" r="9"/><text class="numt" x="184" y="218" text-anchor="middle">4</text>
    <circle class="num" cx="516" cy="210" r="9"/><text class="numt" x="516" y="214" text-anchor="middle">5</text>
    <circle class="num" cx="710" cy="306" r="9"/><text class="numt" x="710" y="310" text-anchor="middle">6</text>
  </g>
</svg>
