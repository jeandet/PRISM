[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.14.0', 'nanobind>=2.0']

[project]
name = "prism"
description = "PRISM - Persistent Rendering & Interactive Scene Model"
authors = [{name="PRISM Contributors"}]
license = {text="MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
dynamic = ["version"]

[tool.pytest.ini_options]
pythonpath = ["builddir/python"]
addopts = "--import-mode=importlib"

[tool.meson-python.args]
setup = [
  '-Doptimization=3', '-Dcpp_std=c++26',
  '-Dtests=disabled', '-Dexamples=disabled', '-Dbenchmarks=disabled', '-Dmagic_enum:test=false',
  # Vendored deps are built from wraps and linked statically, freetype and harfbuzz included: system
  # copies (Homebrew on macOS) are built for the build machine's OS, not the wheel's target.
  '--force-fallback-for=fmt,sdl3,sdl3_ttf,freetype2,harfbuzz',
  '-Dfmt:default_library=static', '-Dsdl3:default_library=static', '-Dsdl3_ttf:default_library=static',
  '-Dsdl3:werror=false', '-Dsdl3:warning_level=0', '-Dsdl3_ttf:werror=false', '-Dsdl3_ttf:warning_level=0',
  # Optional features off, so neither picks up other libraries from the build machine.
  '-Dfreetype2:default_library=static', '-Dfreetype2:werror=false', '-Dfreetype2:warning_level=0',
  '-Dfreetype2:zlib=internal', '-Dfreetype2:png=disabled', '-Dfreetype2:bzip2=disabled',
  '-Dfreetype2:brotli=disabled', '-Dfreetype2:harfbuzz=disabled', '-Dfreetype2:tests=disabled',
  '-Dharfbuzz:default_library=static', '-Dharfbuzz:werror=false', '-Dharfbuzz:warning_level=0',
  '-Dharfbuzz:freetype=enabled', '-Dharfbuzz:glib=disabled', '-Dharfbuzz:gobject=disabled',
  '-Dharfbuzz:cairo=disabled', '-Dharfbuzz:chafa=disabled', '-Dharfbuzz:icu=disabled',
  '-Dharfbuzz:raster=disabled', '-Dharfbuzz:vector=disabled', '-Dharfbuzz:subset=disabled',
  '-Dharfbuzz:tests=disabled', '-Dharfbuzz:docs=disabled', '-Dharfbuzz:utilities=disabled',
  '-Dharfbuzz:introspection=disabled',
  '--vsenv',
]
install = ['--tags=runtime,python-runtime']

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp314t-*"]
enable = ["cpython-freethreading"]
# MSVC has no usable C++26 for this codebase yet; musl/i686/PyPy are out of scope.
skip = ["*-win*", "*-musllinux*", "*_i686", "pp*"]
build-verbosity = 1
test-command = "python {project}/python/tests/wheel_smoke.py"

[tool.cibuildwheel.linux]
# AlmaLinux 9: pipewire >= 0.3.47 (SDL3 needs spa/utils/json.h) and gcc-toolset-14.
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
# C++26 needs GCC >= 14; SDL3's meson port hard-requires udev/dbus/pipewire/wayland/xkbcommon.
# libXi: EL9 ships 1.7 whose XInput2.h lacks the XI 2.4 gesture structs that SDL3's X11 driver
# compiles against once xorgproto reports XI_2_Minor >= 4 — build 1.8 from source (headers only
# matter; the wheel still links the system libXi.so.6 ABI).
before-all = """
dnf install -y gcc-toolset-14 systemd-devel dbus-devel pipewire-devel wayland-devel libxkbcommon-devel \
  mesa-libEGL-devel mesa-libGL-devel libdrm-devel libX11-devel libXext-devel libXrandr-devel libXcursor-devel \
  libXi-devel libXfixes-devel libXScrnSaver-devel alsa-lib-devel pulseaudio-libs-devel \
  xorg-x11-proto-devel xz make
curl -fsSL https://www.x.org/releases/individual/lib/libXi-1.8.2.tar.xz | tar xJ -C /tmp
cd /tmp/libXi-1.8.2 && ./configure --prefix=/usr --libdir=/usr/lib64 && make -j"$(nproc)" && make install
"""
environment = { PATH = "/opt/rh/gcc-toolset-14/root/usr/bin:$PATH", CC = "gcc", CXX = "g++" }

[tool.cibuildwheel.macos]
# C++ with Homebrew GCC (the maintainer's setup; the exact g++-N is exported by the workflow
# step), C with Apple clang (SDL3's darwin sources need Blocks). SDL3 stays SHARED here: its
# Objective-C @available checks need clang's compiler-rt (___isPlatformVersionAtLeast), which a
# g++-driven link of a static libSDL3.a cannot provide; delocate bundles libSDL3.dylib. SDL3_ttf
# (plain C, not installed by its subproject) stays static.
before-all = "brew install gcc pkg-config"
config-settings = { "setup-args" = ["-Dsdl3:default_library=shared"] }
