# Emscripten (wasm32) cross file, based on emscripten's tools/meson/wasm32-emscripten.ini.
# Usage (emsdk env sourced):
#   meson setup builddir-wasm --cross-file cross/wasm32-emscripten.ini
#   meson test -C builddir-wasm      # runs the headless tests under node

[binaries]
c = 'emcc'
cpp = 'em++'
ar = 'emar'
ranlib = 'emranlib'
exe_wrapper = 'node'

[built-in options]
# wasm has no shared libraries (short of emscripten's MAIN_MODULE/SIDE_MODULE mode).
default_library = 'static'
# PRISM always runs a logic thread next to the event loop, so threads are not optional.
# Emscripten disables catching C++ exceptions by default; PRISM catches them (e.g. the
# mutation drain loop), so use native wasm exception handling on both compile and link.
c_args = ['-pthread']
cpp_args = ['-pthread', '-fwasm-exceptions']
c_link_args = ['-pthread', '-sALLOW_MEMORY_GROWTH']
cpp_link_args = ['-pthread', '-fwasm-exceptions', '-sALLOW_MEMORY_GROWTH']

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
