<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" role="img" aria-label="A producer thread sets one coalescing Shared value at 1 kHz; the logic thread drains the newest value on a perpetual tick, ingests it into the ring buffer, the table slice and the plot, builds one scene snapshot from the dirty widgets, and hands it to the backend, which presents it or only keeps the build stats.">
  <style>
    text { font: 13px system-ui, sans-serif; fill: #1f2328; }
    .small { font-size: 11.5px; fill: #57606a; }
    .lane-title { font-weight: 600; font-size: 12.5px; }
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.2; }
    .key { stroke: #7c3cf5; stroke-width: 1.8; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .hot { stroke: #f2542d; }
    .tip { fill: #57606a; }
    .tip.hot { fill: #f2542d; }
    .logic { fill: #22b4ff; fill-opacity: 0.10; }
    .audio { fill: #f2542d; fill-opacity: 0.09; }
    .analysis { fill: #36d6cf; fill-opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .small { fill: #9da7b3; }
      .box { fill: #161b22; stroke: #9da7b3; }
      .arrow { stroke: #9da7b3; }
      .tip { fill: #9da7b3; }
      .key { stroke: #a371f7; }
      .hot { stroke: #ff7b5c; }
      .tip.hot { fill: #ff7b5c; }
    }
  </style>

  <!-- lanes -->
  <rect class="analysis" x="8" y="20" width="1104" height="92" rx="8"/>
  <rect class="logic" x="8" y="152" width="1104" height="140" rx="8"/>
  <rect class="analysis" x="8" y="328" width="1104" height="80" rx="8"/>
  <text class="lane-title" x="20" y="40">producer thread</text>
  <text class="small" x="20" y="56">one jthread, fixed rate</text>
  <text class="lane-title" x="20" y="172">logic thread</text>
  <text class="small" x="20" y="188">owns the fields, builds the frames</text>
  <text class="lane-title" x="20" y="348">the backend</text>
  <text class="small" x="20" y="364">SDL3, or --headless</text>

  <!-- producer lane -->
  <rect class="box" x="200" y="64" width="150" height="44" rx="6"/>
  <text x="275" y="83" text-anchor="middle">produce_loop</text>
  <text class="small" x="275" y="99" text-anchor="middle">sleeps to the deadline</text>

  <rect class="box key" x="420" y="64" width="200" height="44" rx="6"/>
  <text x="520" y="83" text-anchor="middle">telemetry</text>
  <text class="small" x="520" y="99" text-anchor="middle">Shared&lt;double&gt;: newest wins</text>

  <!-- logic lane -->
  <rect class="box" x="200" y="192" width="130" height="44" rx="6"/>
  <text x="265" y="211" text-anchor="middle">drain</text>
  <text class="small" x="265" y="227" text-anchor="middle">on every tick</text>

  <rect class="box" x="400" y="192" width="210" height="44" rx="6"/>
  <text x="505" y="211" text-anchor="middle">ingest(v)</text>
  <text class="small" x="505" y="227" text-anchor="middle">ring · table slice · plot.notify</text>

  <rect class="box" x="670" y="192" width="180" height="44" rx="6"/>
  <text x="760" y="211" text-anchor="middle">build_snapshot</text>
  <text class="small" x="760" y="227" text-anchor="middle">the dirty widgets, redrawn</text>

  <rect class="box" x="920" y="192" width="160" height="44" rx="6"/>
  <text x="1000" y="211" text-anchor="middle">submit()</text>
  <text class="small" x="1000" y="227" text-anchor="middle">one snapshot per publish</text>

  <!-- backend lane -->
  <rect class="box" x="680" y="340" width="420" height="44" rx="6"/>
  <text x="890" y="359" text-anchor="middle">the backend</text>
  <text class="small" x="890" y="375" text-anchor="middle">SDL3 presents it · --headless keeps the build times</text>

  <!-- arrows -->
  <line class="arrow" x1="350" y1="86" x2="414" y2="86"/>
  <polygon class="tip" points="420,86 412,82 412,90"/>
  <text class="small" x="385" y="76" text-anchor="middle">set(v)</text>

  <line class="arrow hot" x1="510" y1="108" x2="510" y2="185"/>
  <polygon class="tip hot" points="510,192 506,184 514,184"/>
  <text class="small" x="520" y="134">latest value,</text>
  <text class="small" x="520" y="148">once per tick</text>

  <line class="arrow" x1="330" y1="214" x2="394" y2="214"/>
  <polygon class="tip" points="400,214 392,210 392,218"/>
  <text class="small" x="365" y="204" text-anchor="middle">the value</text>

  <line class="arrow" x1="610" y1="214" x2="664" y2="214"/>
  <polygon class="tip" points="670,214 662,210 662,218"/>
  <text class="small" x="640" y="204" text-anchor="middle">dirties</text>

  <line class="arrow" x1="850" y1="214" x2="914" y2="214"/>
  <polygon class="tip" points="920,214 912,210 912,218"/>
  <text class="small" x="885" y="204" text-anchor="middle">snapshot</text>

  <line class="arrow" x1="1000" y1="236" x2="1000" y2="333"/>
  <polygon class="tip" points="1000,340 996,332 1004,332"/>
  <text class="small" x="1010" y="270">one snapshot</text>
  <text class="small" x="1010" y="284">per publish</text>
</svg>
