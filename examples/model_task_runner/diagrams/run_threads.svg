<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 344" width="1020" height="344" role="img" aria-label="Two threads: the logic thread launches a run's jthread, the run's thread turns its output into batches of 4096 lines or 16 ms and sends them through a Channel, ctx.receive wakes the logic thread which appends them to the console's list, and the list paints only the rows on screen; stop asks the thread to finish and joins it.">
  <style>
    text { font: 13px system-ui, sans-serif; fill: #1f2328; }
    .small { font-size: 11.5px; fill: #57606a; }
    .lane-title { font-weight: 600; font-size: 12.5px; }
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.2; }
    .key { stroke: #7c3cf5; stroke-width: 1.8; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .hot { stroke: #f2542d; }
    .tip { fill: #57606a; }
    .tip.hot { fill: #f2542d; }
    .logic { fill: #22b4ff; fill-opacity: 0.10; }
    .audio { fill: #f2542d; fill-opacity: 0.09; }
    .analysis { fill: #36d6cf; fill-opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .small { fill: #9da7b3; }
      .box { fill: #161b22; stroke: #9da7b3; }
      .arrow { stroke: #9da7b3; }
      .tip { fill: #9da7b3; }
      .key { stroke: #a371f7; }
      .hot { stroke: #ff7b5c; }
      .tip.hot { fill: #ff7b5c; }
    }
  </style>

  <!-- lanes -->
  <rect class="logic" x="8" y="20" width="1004" height="144" rx="8"/>
  <rect class="analysis" x="8" y="226" width="1004" height="110" rx="8"/>
  <text class="lane-title" x="20" y="42">logic thread</text>
  <text class="small" x="20" y="58">owns every Field</text>
  <text class="lane-title" x="20" y="248">the run's thread</text>
  <text class="small" x="20" y="264">one jthread per run, no PRISM</text>

  <!-- logic lane -->
  <rect class="box" x="200" y="70" width="150" height="48" rx="6"/>
  <text x="275" y="90" text-anchor="middle">TasksPanel</text>
  <text class="small" x="275" y="107" text-anchor="middle">Run, the task list</text>

  <rect class="box" x="410" y="70" width="180" height="48" rx="6"/>
  <text x="500" y="90" text-anchor="middle">ctx.receive(link.output)</text>
  <text class="small" x="500" y="107" text-anchor="middle">one batch, logic thread</text>

  <rect class="box" x="650" y="70" width="150" height="48" rx="6"/>
  <text x="725" y="90" text-anchor="middle">ConsolePane</text>
  <text class="small" x="725" y="107" text-anchor="middle">ingest, filter, list</text>

  <rect class="box" x="860" y="70" width="120" height="48" rx="6"/>
  <text x="920" y="90" text-anchor="middle">the rows</text>
  <text class="small" x="920" y="107" text-anchor="middle">visible ones paint</text>

  <!-- run lane -->
  <rect class="box" x="200" y="252" width="200" height="48" rx="6"/>
  <text x="300" y="272" text-anchor="middle">run_job()</text>
  <text class="small" x="300" y="289" text-anchor="middle">generated lines, or a process</text>

  <rect class="box key" x="460" y="252" width="200" height="48" rx="6"/>
  <text x="560" y="272" text-anchor="middle">Batcher</text>
  <text class="small" x="560" y="289" text-anchor="middle">4096 lines, or every 16 ms</text>

  <!-- arrows -->
  <line class="arrow" x1="275" y1="118" x2="275" y2="246"/>
  <polygon class="tip" points="275,252 271,244 279,244"/>
  <text class="small" x="285" y="172">launch()</text>

  <line class="arrow" x1="400" y1="276" x2="454" y2="276"/>
  <polygon class="tip" points="460,276 452,272 452,280"/>
  <text class="small" x="430" y="268" text-anchor="middle">add(line)</text>

  <line class="arrow hot" x1="560" y1="252" x2="560" y2="124"/>
  <polygon class="tip hot" points="560,118 556,126 564,126"/>
  <text class="small" x="570" y="152">Channel&lt;OutputBatch&gt;</text>
  <text class="small" x="570" y="168">at most 4096 lines at a time</text>

  <line class="arrow" x1="590" y1="94" x2="644" y2="94"/>
  <polygon class="tip" points="650,94 642,90 642,98"/>
  <text class="small" x="620" y="84" text-anchor="middle">ingest</text>

  <line class="arrow" x1="800" y1="94" x2="854" y2="94"/>
  <polygon class="tip" points="860,94 852,90 852,98"/>
  <text class="small" x="830" y="84" text-anchor="middle">append</text>

  <polyline class="arrow" points="775,118 775,320 394,320 394,306"/>
  <polygon class="tip" points="394,300 390,308 398,308"/>
  <text class="small" x="405" y="312">stop(): request_stop, then join</text>
</svg>
