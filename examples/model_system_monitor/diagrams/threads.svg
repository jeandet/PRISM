<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 306" width="1080" height="306" role="img" aria-label="Three threads: a system sampler publishes a SystemSample into a Shared and a process sampler publishes its list into a Shared, both handed to the logic thread by ctx.receive, which refills the three plot histories and the table and tree; the process sampler also sends every process start and stop through a Channel, which keeps its order, into the event log.">
  <style>
    text { font: 13px system-ui, sans-serif; fill: #1f2328; }
    .small { font-size: 11.5px; fill: #57606a; }
    .lane-title { font-weight: 600; font-size: 12.5px; }
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.2; }
    .key { stroke: #7c3cf5; stroke-width: 1.8; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .hot { stroke: #f2542d; }
    .tip { fill: #57606a; }
    .tip.hot { fill: #f2542d; }
    .logic { fill: #22b4ff; fill-opacity: 0.10; }
    .audio { fill: #f2542d; fill-opacity: 0.09; }
    .analysis { fill: #36d6cf; fill-opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .small { fill: #9da7b3; }
      .box { fill: #161b22; stroke: #9da7b3; }
      .arrow { stroke: #9da7b3; }
      .tip { fill: #9da7b3; }
      .key { stroke: #a371f7; }
      .hot { stroke: #ff7b5c; }
      .tip.hot { fill: #ff7b5c; }
    }
  </style>

  <!-- lanes -->
  <rect class="logic" x="8" y="20" width="1064" height="150" rx="8"/>
  <rect class="analysis" x="8" y="200" width="1064" height="96" rx="8"/>
  <text class="lane-title" x="20" y="40">logic thread</text>
  <text class="small" x="20" y="56">owns the model</text>
  <text class="lane-title" x="20" y="220">sampler threads</text>
  <text class="small" x="20" y="236">never touch a Field</text>

  <!-- logic lane -->
  <rect class="box" x="210" y="66" width="190" height="48" rx="6"/>
  <text x="305" y="86" text-anchor="middle">ingest_system()</text>
  <text class="small" x="305" y="103" text-anchor="middle">History, plots</text>

  <rect class="box" x="460" y="66" width="200" height="48" rx="6"/>
  <text x="560" y="86" text-anchor="middle">ingest_processes()</text>
  <text class="small" x="560" y="103" text-anchor="middle">Table, Tree</text>

  <rect class="box" x="720" y="66" width="180" height="48" rx="6"/>
  <text x="810" y="86" text-anchor="middle">ingest_process_event()</text>
  <text class="small" x="810" y="103" text-anchor="middle">event log</text>

  <rect class="box" x="940" y="66" width="124" height="48" rx="6"/>
  <text x="1002" y="86" text-anchor="middle">heartbeat</text>
  <text class="small" x="1002" y="103" text-anchor="middle">clock tick, no data</text>

  <!-- sampler lane -->
  <rect class="box" x="200" y="232" width="220" height="48" rx="6"/>
  <text x="310" y="252" text-anchor="middle">poll_system_loop</text>
  <text class="small" x="310" y="269" text-anchor="middle">one sample a second</text>

  <rect class="box" x="560" y="232" width="210" height="48" rx="6"/>
  <text x="665" y="252" text-anchor="middle">poll_processes_loop</text>
  <text class="small" x="665" y="269" text-anchor="middle">one list every 1.5 s</text>

  <!-- crossings -->
  <line class="arrow" x1="310" y1="232" x2="310" y2="121"/>
  <polygon class="tip" points="310,114 306,122 314,122"/>
  <text class="small" x="320" y="150">Shared&lt;SystemSample&gt;</text>
  <text class="small" x="320" y="164">+ ctx.receive:</text>
  <text class="small" x="320" y="178">newest sample wins</text>

  <line class="arrow" x1="600" y1="232" x2="600" y2="121"/>
  <polygon class="tip" points="600,114 596,122 604,122"/>
  <text class="small" x="610" y="150">Shared&lt;std::vector&lt;ProcessInfo&gt;&gt;</text>
  <text class="small" x="610" y="164">+ ctx.receive:</text>
  <text class="small" x="610" y="178">newest list wins</text>

  <polyline class="arrow hot" points="770,256 880,256 880,121"/>
  <polygon class="tip hot" points="880,114 876,122 884,122"/>
  <text class="small" x="890" y="150">Channel&lt;ProcessEvent&gt;</text>
  <text class="small" x="890" y="164">+ ctx.receive:</text>
  <text class="small" x="890" y="178">no event dropped</text>
</svg>
