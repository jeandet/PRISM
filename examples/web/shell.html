<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>PRISM · WebAssembly demo</title>
  <!-- Threads need cross-origin isolation (COOP/COEP headers). Static hosts like GitHub Pages
       can't send them, so this service worker adds them; it does nothing where the server
       already sends them (e.g. emrun). -->
  <script src="coi-serviceworker.js"></script>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; background: #16161e; color: #c0caf5;
           font: 14px/1.4 system-ui, sans-serif; }
    #status { padding: 10px 16px; color: #9aa5ce; }
    /* The app window fills the page (SDL's fill-document mode hides the status once it runs). */
    canvas { display: block; margin: 0; outline: none; }
    #back { position: fixed; top: 6px; right: 8px; z-index: 10; padding: 3px 10px;
            border-radius: 6px; background: rgba(22, 22, 30, 0.8); color: #7aa2f7;
            font: 13px/1.4 system-ui, sans-serif; text-decoration: none; opacity: 0.75; }
    #back:hover { opacity: 1; }
  </style>
</head>
<body>
  <a id="back" href="./">← PRISM examples</a>
  <div id="status">Loading…</div>
  <!-- The canvas must be its container's only child. SDL's fill-document mode records the
       canvas's next sibling, hides every other <body> element, and later (e.g. when it recreates
       the window for the renderer) re-inserts the canvas before that sibling -- which throws if
       the sibling was an element it had hidden, as happens once emcc minifies this page. -->
  <div id="app"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
  <script>
    var statusEl = document.getElementById('status');
    var backEl = document.getElementById('back');
    // SDL's fill-document mode moves every other element of <body> into a hidden div when the
    // window opens; put the back link straight back so it floats over the app.
    new MutationObserver(function () {
      if (backEl.parentNode !== document.body) document.body.appendChild(backEl);
    }).observe(document.body, { childList: true });
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (text) { statusEl.textContent = text; },
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
    };
    window.addEventListener('error', function () { statusEl.textContent = 'Error — see the browser console'; });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
