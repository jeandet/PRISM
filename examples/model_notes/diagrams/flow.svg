<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-label="One thread: a key, a click or a menu item changes a field, whose on_change connections set status and modified (which repaint the status bar and the Save entries), and a Derived in the Statistics window recomputes from the same body field.">
  <style>
    text { font: 13px system-ui, sans-serif; fill: #1f2328; }
    .small { font-size: 11.5px; fill: #57606a; }
    .lane-title { font-weight: 600; font-size: 12.5px; }
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.2; }
    .key { stroke: #7c3cf5; stroke-width: 1.8; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .hot { stroke: #f2542d; }
    .tip { fill: #57606a; }
    .tip.hot { fill: #f2542d; }
    .logic { fill: #22b4ff; fill-opacity: 0.10; }
    .audio { fill: #f2542d; fill-opacity: 0.09; }
    .analysis { fill: #36d6cf; fill-opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .small { fill: #9da7b3; }
      .box { fill: #161b22; stroke: #9da7b3; }
      .arrow { stroke: #9da7b3; }
      .tip { fill: #9da7b3; }
      .key { stroke: #a371f7; }
      .hot { stroke: #ff7b5c; }
      .tip.hot { fill: #ff7b5c; }
    }
  </style>

  <!-- lanes -->
  <rect class="logic" x="8" y="20" width="1064" height="144" rx="8"/>
  <rect class="analysis" x="8" y="196" width="1064" height="96" rx="8"/>
  <text class="lane-title" x="20" y="40">logic thread</text>
  <text class="small" x="20" y="56">the only one; every field is here</text>
  <text class="lane-title" x="20" y="216">second window</text>
  <text class="small" x="20" y="232">Statistics, opened from View</text>

  <!-- logic lane -->
  <rect class="box" x="200" y="74" width="130" height="48" rx="6"/>
  <text x="265" y="94" text-anchor="middle">input</text>
  <text class="small" x="265" y="111" text-anchor="middle">key, click, menu, drop</text>

  <rect class="box key" x="396" y="74" width="150" height="48" rx="6"/>
  <text x="471" y="94" text-anchor="middle">body</text>
  <text class="small" x="471" y="111" text-anchor="middle">Field&lt;TextArea&lt;&gt;&gt;</text>

  <rect class="box" x="612" y="74" width="200" height="48" rx="6"/>
  <text x="712" y="94" text-anchor="middle">on_change()</text>
  <text class="small" x="712" y="111" text-anchor="middle">update_matches, refresh_status</text>

  <rect class="box" x="880" y="74" width="180" height="48" rx="6"/>
  <text x="970" y="94" text-anchor="middle">status, modified</text>
  <text class="small" x="970" y="111" text-anchor="middle">status bar, Save items</text>

  <!-- second window -->
  <rect class="box" x="200" y="214" width="130" height="44" rx="6"/>
  <text x="265" y="233" text-anchor="middle">View &#8250; Statistics</text>
  <text class="small" x="265" y="249" text-anchor="middle">ctx-&gt;open_window</text>

  <rect class="box" x="396" y="214" width="214" height="44" rx="6"/>
  <text x="503" y="233" text-anchor="middle">Derived&lt;std::string&gt;</text>
  <text class="small" x="503" y="249" text-anchor="middle">recomputed from body</text>

  <rect class="box" x="700" y="214" width="150" height="44" rx="6"/>
  <text x="775" y="233" text-anchor="middle">label</text>
  <text class="small" x="775" y="249" text-anchor="middle">in that window</text>

  <!-- arrows -->
  <line class="arrow" x1="330" y1="98" x2="390" y2="98"/>
  <polygon class="tip" points="396,98 388,94 388,102"/>
  <text class="small" x="363" y="88" text-anchor="middle">edit</text>

  <line class="arrow" x1="546" y1="98" x2="606" y2="98"/>
  <polygon class="tip" points="612,98 604,94 604,102"/>
  <text class="small" x="576" y="88" text-anchor="middle">notifies</text>

  <line class="arrow" x1="812" y1="98" x2="874" y2="98"/>
  <polygon class="tip" points="880,98 872,94 872,102"/>
  <text class="small" x="843" y="88" text-anchor="middle">sets both</text>

  <line class="arrow hot" x1="471" y1="122" x2="471" y2="208"/>
  <polygon class="tip hot" points="471,214 467,206 475,206"/>
  <text class="small" x="481" y="146">a change</text>
  <text class="small" x="481" y="160">recomputes it</text>

  <line class="arrow" x1="330" y1="236" x2="390" y2="236"/>
  <polygon class="tip" points="396,236 388,232 388,240"/>
  <text class="small" x="363" y="226" text-anchor="middle">opens</text>

  <line class="arrow" x1="610" y1="236" x2="694" y2="236"/>
  <polygon class="tip" points="700,236 692,232 692,240"/>
  <text class="small" x="655" y="226" text-anchor="middle">the new text</text>
</svg>
