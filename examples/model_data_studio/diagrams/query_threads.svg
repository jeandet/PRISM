<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 348" width="1060" height="348" role="img" aria-label="Two threads: the logic thread puts a query in a mutex-guarded request slot, the worker thread runs it in SQLite and reports progress back through a Channel and its answer through a Shared, so the window keeps drawing; the logic thread cancels it through an atomic SQLite handle and sqlite3_interrupt.">
  <style>
    text { font: 13px system-ui, sans-serif; fill: #1f2328; }
    .small { font-size: 11.5px; fill: #57606a; }
    .lane-title { font-weight: 600; font-size: 12.5px; }
    .box { fill: #ffffff; stroke: #57606a; stroke-width: 1.2; }
    .key { stroke: #7c3cf5; stroke-width: 1.8; }
    .arrow { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .hot { stroke: #f2542d; }
    .tip { fill: #57606a; }
    .tip.hot { fill: #f2542d; }
    .logic { fill: #22b4ff; fill-opacity: 0.10; }
    .audio { fill: #f2542d; fill-opacity: 0.09; }
    .analysis { fill: #36d6cf; fill-opacity: 0.12; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .small { fill: #9da7b3; }
      .box { fill: #161b22; stroke: #9da7b3; }
      .arrow { stroke: #9da7b3; }
      .tip { fill: #9da7b3; }
      .key { stroke: #a371f7; }
      .hot { stroke: #ff7b5c; }
      .tip.hot { fill: #ff7b5c; }
    }
  </style>

  <!-- lanes -->
  <rect class="logic" x="8" y="20" width="1044" height="144" rx="8"/>
  <rect class="audio" x="8" y="226" width="1044" height="110" rx="8"/>
  <text class="lane-title" x="20" y="42">logic thread</text>
  <text class="small" x="20" y="58">owns every Field</text>
  <text class="lane-title" x="20" y="248">worker thread</text>
  <text class="small" x="20" y="264">SQLite, no PRISM types</text>

  <!-- logic lane -->
  <rect class="box" x="200" y="70" width="150" height="48" rx="6"/>
  <text x="275" y="90" text-anchor="middle">Editor, Queries</text>
  <text class="small" x="275" y="107" text-anchor="middle">the SQL, Run, Cancel</text>

  <rect class="box" x="410" y="70" width="170" height="48" rx="6"/>
  <text x="495" y="90" text-anchor="middle">request slot</text>
  <text class="small" x="495" y="107" text-anchor="middle">mutex + condvar</text>

  <rect class="box" x="640" y="70" width="140" height="48" rx="6"/>
  <text x="710" y="90" text-anchor="middle">StatusBar</text>
  <text class="small" x="710" y="107" text-anchor="middle">seconds, busy bar</text>

  <rect class="box" x="840" y="70" width="140" height="48" rx="6"/>
  <text x="910" y="90" text-anchor="middle">Table, Chart</text>
  <text class="small" x="910" y="107" text-anchor="middle">one revision bump</text>

  <!-- worker lane -->
  <rect class="box key" x="600" y="252" width="380" height="48" rx="6"/>
  <text x="790" y="272" text-anchor="middle">load_trips() then read_all()</text>
  <text class="small" x="790" y="289" text-anchor="middle">the slow part: one SQLite call, seconds inside it</text>

  <!-- arrows -->
  <line class="arrow" x1="350" y1="94" x2="404" y2="94"/>
  <polygon class="tip" points="410,94 402,90 402,98"/>
  <text class="small" x="380" y="84" text-anchor="middle">submit()</text>

  <polyline class="arrow" points="495,118 495,276 594,276"/>
  <polygon class="tip" points="600,276 592,272 592,280"/>
  <text class="small" x="505" y="180">pending_</text>
  <text class="small" x="505" y="196">notify_one</text>

  <line class="arrow" x1="680" y1="252" x2="680" y2="124"/>
  <polygon class="tip" points="680,118 676,126 684,126"/>
  <text class="small" x="690" y="152">Channel&lt;RunnerEvent&gt;</text>
  <text class="small" x="690" y="168">loading %, elapsed</text>

  <line class="arrow hot" x1="880" y1="252" x2="880" y2="124"/>
  <polygon class="tip hot" points="880,118 876,126 884,126"/>
  <text class="small" x="898" y="152">Shared&lt;QueryOutcome&gt;</text>
  <text class="small" x="898" y="168">newest answer wins</text>

  <polyline class="arrow" points="275,118 275,318 694,318 694,306"/>
  <polygon class="tip" points="694,300 690,308 698,308"/>
  <text class="small" x="285" y="310">cancel(): atomic sqlite3*, then sqlite3_interrupt</text>
</svg>
